<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ROSE BIBLE • King James Version • Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- W3.CSS -->
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>


<body>
  <audio id="whooshSound" src="whoosh.mp3" preload="auto"></audio>

  <div class="w3-display-container landing-wrap">
    <div class="w3-display-middle" style="width:100%;">
      <div id="landingCard" class="landing-card w3-center">

        <div class="coming-soon">COMING&nbsp;SOON</div>

        <div class="neon-divider"></div>

        <h1 class="main-title">ROSE BIBLE</h1>
        <div class="subtitle">KING&nbsp;JAMES&nbsp;VERSION</div>

        <p class="tagline">
          A powerful Strong’s-driven interactive KJV Bible experience — coming soon.
        </p>

        <!-- 🌟 NEW NEON BUTTON -->
        <a href="#" class="neon-btn" onclick="playWhooshThenGo()">Sneak Peek</a>



      </div>
    </div>
  </div>
  <script>
    function playWhooshThenGo() {
      const audio = document.getElementById("whooshSound");
      const targetUrl = "testament.html";   // 👈 relative path (no leading /)
  
      if (!audio) {
        // fallback if audio element missing
        window.location.href = targetUrl;
        return;
      }
  
      // Restart sound to the beginning
      audio.currentTime = 0;
  
      // Play the audio
      audio.play().then(() => {
        console.log("Whoosh started playing…");
  
        // When the FULL audio finishes, redirect
        audio.onended = function () {
          console.log("Whoosh finished. Going to", targetUrl);
          window.location.href = targetUrl;
        };
  
      }).catch(err => {
        console.warn("Autoplay blocked or error:", err);
        window.location.href = targetUrl; // fallback
      });
    }
  </script>
    
</body>
</html>
